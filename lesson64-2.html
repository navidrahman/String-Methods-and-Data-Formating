<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="receipt">
        <h1>Digital Receipt</h1>
        <p>Receipt No: <span id="receipt-number"></span></p>
        <p>Date: <span id="date"></span></p>
        <div class="row">
            <span id="product"></span>
            <span id="price"></span>
        </div>
        <div class="row">
            <span>Quantity:</span>
            <span id="quantity"></span>
        </div>
        <div class="row total">
            <span>Total:</span>
            <span id="total"></span>
        </div>
    </div>
 
    <script>
        const receiptNumber = "27";
        const date = "2026-11-6";
        const product = "Wireless Mouse";
        const price = 49.5;
        const quantity = 2;
        const total = price * quantity;

        const formattedReceiptNumber = receiptNumber.padStart(5, "0");
        const formattedPrice = price.toFixed(2);
        const formattedTotal = total.toFixed(2);
        const dateparts = date.split("-");  
        const formattedDate = `${dateparts[2]}/${dateparts[1]}/${dateparts[0]}`;

        document.getElementById("receipt-number").textContent = formattedReceiptNumber;
        document.getElementById("date").textContent = formattedDate;
        document.getElementById("product").textContent = product;
        document.getElementById("price").textContent = `$${formattedPrice}`;
        document.getElementById("quantity").textContent = quantity;
        document.getElementById("total").textContent = `$${formattedTotal}`;
    </script>
</body>
</html>
